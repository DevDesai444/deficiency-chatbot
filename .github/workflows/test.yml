name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --group dev

      - name: Run offline test suite
        run: |
          # D-RB6: DATABRICKS_HOST / DATABRICKS_TOKEN are deliberately ABSENT. The whole offline
          # contract is that the suite is green without them. If a test starts requiring credentials
          # it fails here rather than silently becoming un-runnable for everyone else.
          # The `-m "not slow"` fast lane runs here; the corpus-gated slow lane is the pytest-slow job.
          uv run pytest -m "not slow" -q

      - name: Enforce coverage-gate (RULES-06 no-regress + D-ENR1 traceability floor)
        env:
          # `python -m evals.run` needs src/ on the path (pyproject's pythonpath=src applies to
          # pytest only, not to `python -m`); mirrors docs/eval/BASELINE.md's PYTHONPATH=src usage.
          PYTHONPATH: src
        run: |
          # Fully offline: coverage-gate re-measures the committed rulebook snapshot + requirement
          # index (no data/ corpus, no Databricks, no LLM) and fails the build on any per-source /
          # per-family regression below src/evals/baseline/coverage_baseline.json.
          uv run python -m evals.run coverage-gate

      - name: Enforce absence-gate (RECALL-01 tripwire on the gate code path)
        env:
          PYTHONPATH: src
        run: |
          # absence-gate is offline-SAFE (WR-03): data/ is gitignored in CI, so every non-held-out
          # absence document fails to ingest and is skipped -> the gate emits
          # `ABSENCE-GATE SKIPPED (no local corpus)` and exits 0. This step therefore acts as an
          # ALWAYS-ON TRIPWIRE that the gate code path builds, imports, and runs clean every build;
          # it does NOT measure absence recovery in vanilla CI (there is no corpus to measure). Where
          # a corpus is provisioned (self-hosted/scheduled with data/ present) the SAME command
          # measures the real non-held-out aggregate and ratchets against the committed baseline.
          uv run python -m evals.run absence-gate

  pytest-slow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --group dev

      - name: Run slow lane (corpus-gated held-out generality invariants)
        run: |
          # HONEST SCOPE: the slow lane's SAME-LOGIC + THRESHOLD-TRANSFER (and RENAME-INVARIANCE)
          # invariants require the gitignored held-out corpus data/32s41-Specification.pdf. In stock
          # GitHub CI that file is absent, so those tests `pytest.skip` -- this job does NOT enforce
          # anti-overfitting transfer in vanilla CI. Its purpose is to COLLECT and EXERCISE the slow
          # lane every build (catching import/collection errors and skip-logic drift), and to run the
          # invariants FOR REAL wherever the corpus is provisioned (a self-hosted runner or a
          # scheduled build that checks out data/). Do not read a green here as transfer being proven.
          uv run pytest -m slow -q
