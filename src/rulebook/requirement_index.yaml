- id: Q2-SPECIFICITY
  family: 3.2.S.4.3
  citation: 'ICH Q2(R2) -- Glossary: Specificity/Selectivity'
  trigger: Analytical method validation must demonstrate specificity/selectivity -- the ability to measure
    the analyte unequivocally in the presence of expected interferences (e.g. impurities, degradants,
    matrix) -- including via stressed/degraded samples for a stability-indicating method.
  provenance_span_id:
    doc_id: ich-Q2-R2
    start: 49702
    end: 50179
    hash: a38970d1605945a5
- id: Q2-LINEARITY
  family: 3.2.S.4.3
  citation: ICH Q2(R2) -- 3.2 Linearity
  trigger: Demonstrated linearity must be assessed across a range that covers the reportable specification
    limits (e.g. impurity/assay acceptance criteria) -- not merely an arbitrarily chosen working range.
  provenance_span_id:
    doc_id: ich-Q2-R2
    start: 30218
    end: 30348
    hash: a52a00f71b85e7b2
- id: Q2-DETECTION-LIMIT
  family: 3.2.S.4.3
  citation: 'ICH Q2(R2) -- Glossary: Detection Limit (DL)'
  trigger: Determination of the Limit of Detection must be supported by data (e.g. standard deviation
    of the response and slope, signal-to-noise, or a dilution series) -- a stated DL with no underlying
    calculation or data is unsupported.
  provenance_span_id:
    doc_id: ich-Q2-R2
    start: 45055
    end: 45194
    hash: 44b296ac920e19ba
- id: Q2-QUANTITATION-LIMIT
  family: 3.2.S.4.3
  citation: 'ICH Q2(R2) -- Glossary: Quantitation Limit (QL)'
  trigger: Determination of the Limit of Quantitation must be supported by data, and precision at the
    LOQ level must be demonstrated as adequate for reliable quantitation -- a marginal or unsupported
    LOQ is incomplete.
  provenance_span_id:
    doc_id: ich-Q2-R2
    start: 47069
    end: 47212
    hash: 6c8c4d2abb41380c
- id: Q2-PRECISION
  family: 3.2.S.4.3
  citation: 'ICH Q2(R2) -- Glossary: Precision'
  trigger: Method precision (repeatability) must be demonstrated for every reportable specification attribute
    the method tests -- including impurity-related attributes such as Any Unspecified Impurity and Total
    Impurities, not only the primary assay.
  provenance_span_id:
    doc_id: ich-Q2-R2
    start: 46549
    end: 46880
    hash: a2654df6603eb484
- id: Q2-ACCURACY
  family: 3.2.S.4.3
  citation: 'ICH Q2(R2) -- Glossary: Accuracy'
  trigger: A narrative claim that accuracy/recovery was established at multiple concentration levels must
    be supported by an actual accuracy result table or underlying recovery data -- an unsupported assertion
    is incomplete.
  provenance_span_id:
    doc_id: ich-Q2-R2
    start: 43021
    end: 43244
    hash: 60d50f2d3b321b0e
- id: Q2-ROBUSTNESS
  family: 3.2.S.4.3
  citation: 'ICH Q2(R2) -- Glossary: Robustness'
  trigger: Method robustness/ruggedness must be evaluated via deliberate variation of analytical procedure
    parameters and documented.
  provenance_span_id:
    doc_id: ich-Q2-R2
    start: 49454
    end: 49667
    hash: 5c61adee0977432d
- id: Q2-SYSTEM-SUITABILITY
  family: 3.2.S.4.3
  citation: 'ICH Q2(R2) -- Glossary: System Suitability Test (SST)'
  trigger: System suitability tests verifying the measurement system is fit for the intended purpose must
    be defined and applied.
  provenance_span_id:
    doc_id: ich-Q2-R2
    start: 50219
    end: 50468
    hash: 2293b47994d0ea0e
- id: FDA-SOLUTION-STABILITY
  family: 3.2.S.4.3
  citation: 'FDA Guidance: Analytical Procedures and Methods Validation for Drugs and Biologics -- Section
    VII.F Standards Control Solution Preparation'
  trigger: The analytical procedure documentation must include information on the stability of sample/standard/control
    solutions and their storage conditions -- an asserted storage condition (e.g. 'stored at room temperature')
    with no supporting solution-stability information is incomplete.
  provenance_span_id:
    doc_id: fda-analytical-procedures
    start: 17207
    end: 17485
    hash: 0a53fcd32bd93def
- id: Q6A-WATER-CONTENT-TEST
  family: 3.2.S.4.1
  citation: ICH Q6A -- 3.3(e) Water Content
  trigger: A water-content test with justified acceptance criteria is required for hygroscopic or hydrate
    drug substances.
  provenance_span_id:
    doc_id: ich-Q6A
    start: 36060
    end: 36239
    hash: 82fe55a838447ccb
- id: CFR-211194-METHOD-IDENTIFICATION
  family: 3.2.S.4.3
  citation: 21 CFR 211.194(a)(2)
  trigger: Laboratory/validation records must identify the specific test method(s) used (and the governing
    protocol/SOP, including a locatable number or version) -- referencing 'the current in-house SOP' or
    'the verification protocol' with no document identifier is incomplete.
  provenance_span_id:
    doc_id: ecfr-211.194
    start: 481
    end: 742
    hash: e86c7ba6d52b1f31
- id: CFR-211160B-SOUND-BASIS
  family: 3.2.S.5
  citation: 21 CFR 211.160(b)
  trigger: A value/specification assigned on a corrected/anhydrous basis must be scientifically sound,
    including accounting for reported water content.
  provenance_span_id:
    doc_id: ecfr-211.160
    start: 696
    end: 850
    hash: f6c2e60bc8444819
- id: CFR-211194-CALCULATIONS
  family: 3.2.S.5
  citation: 21 CFR 211.194(a)(5)
  trigger: The correction calculation behind a corrected-basis value must be present in the laboratory
    record.
  provenance_span_id:
    doc_id: ecfr-211.194
    start: 1561
    end: 1701
    hash: aa9168a02d5e927d
- id: Q3A-SPECIFIED-IMPURITY-COMPLETENESS
  family: 3.2.S.4.1
  citation: 'ICH Q3A(R2) -- Glossary: Specified Impurity'
  trigger: Every impurity named or identified elsewhere in the submission (e.g. a compendial monograph's
    specified-impurity list) must have a corresponding individually-listed test, acceptance limit, and
    name-mapping entry in the drug-substance specification -- a named impurity with no corresponding limit
    is an incomplete specification.
  provenance_span_id:
    doc_id: ich-Q3A-R2
    start: 22927
    end: 23139
    hash: e07b0857b38af7dd
- id: CFR-211166-STABILITY-PROGRAM
  family: 3.2.P.7
  citation: 21 CFR 211.166(a)
  trigger: A written stability testing program (sample size/intervals, storage conditions, and reliable/specific
    test methods) must be present and followed to support the drug product's storage conditions and expiration
    date.
  provenance_span_id:
    doc_id: ecfr-211.166
    start: 33
    end: 260
    hash: c04df0a9f8e47afb
- id: Q1A-BATCH-SELECTION
  family: 3.2.S.7
  citation: ICH Q1A(R2) -- 2.1.3 Selection of Batches
  trigger: Formal stability data must be provided on at least three primary batches of the drug substance,
    each manufactured to a minimum of pilot scale by the same synthetic route and a process simulating the
    final production process -- a stability claim supported by fewer than three primary batches is incomplete.
  provenance_span_id:
    doc_id: ich-Q1A-R2
    start: 11444
    end: 11766
    hash: b2ca41bf6f057f97
- id: Q1A-TESTING-FREQUENCY
  family: 3.2.P.7
  citation: ICH Q1A(R2) -- 2.1.6 Testing Frequency
  trigger: Long-term stability testing frequency must be sufficient to establish the stability profile --
    normally every 3 months over the first year, every 6 months over the second year, and annually thereafter
    for a proposed re-test period of at least 12 months; a stability study with insufficient time points is
    incomplete.
  provenance_span_id:
    doc_id: ich-Q1A-R2
    start: 12947
    end: 13258
    hash: 45cdff9a5ae38bdf
- id: Q1A-SIGNIFICANT-CHANGE
  family: 3.2.P.7
  citation: ICH Q1A(R2) -- 2.1.7.1 General Case (significant change)
  trigger: When accelerated stability results are likely to approach significant-change criteria, increased
    testing (an added final-time-point sample or a fourth time point) must be conducted -- a study that
    approaches significant change with no corresponding increased testing is incomplete.
  provenance_span_id:
    doc_id: ich-Q1A-R2
    start: 13603
    end: 13831
    hash: e72f558ed3dfe549
- id: Q3A-IDENTIFICATION-THRESHOLD
  family: 3.2.S.4.1
  citation: ICH Q3A(R2) -- 3.1 Organic Impurities (identification threshold)
  trigger: Each drug-substance impurity present above the identification threshold must be identified, and
    analytical procedures must be developed for potential impurities expected to be unusually potent or toxic
    even at or below that threshold -- an unidentified impurity above the threshold is an incomplete specification.
  provenance_span_id:
    doc_id: ich-Q3A-R2
    start: 7899
    end: 8271
    hash: 4429298e030fc270
- id: Q3A-RESULTS-PRECISION
  family: 3.2.S.4.1
  citation: ICH Q3A(R2) -- 3.3 Analytical Procedures (reporting of results)
  trigger: Reported drug-substance impurity results must carry the required precision -- two decimal places
    below 1.0%, one decimal place at or above 1.0%, rounded by conventional rules -- an impurity result reported
    at insufficient precision is incomplete.
  provenance_span_id:
    doc_id: ich-Q3A-R2
    start: 11615
    end: 11857
    hash: 5a2fee83ad45bb62
- id: Q3B-IDENTIFICATION-THRESHOLD
  family: 3.2.P.5
  citation: ICH Q3B(R2) -- 4. Reporting/Control of Degradation Products (identification threshold)
  trigger: Each drug-product degradation product above the identification threshold must be identified;
    analytical procedures must exist for those below the threshold suspected of being unusually potent -- an
    unidentified degradation product above the threshold is an incomplete specification.
  provenance_span_id:
    doc_id: ich-Q3B-R2
    start: 6691
    end: 6823
    hash: c89ddc6e8d085180
- id: Q3B-TOTAL-DEGRADATION-REPORTING
  family: 3.2.P.5
  citation: ICH Q3B(R2) -- 4. Reporting of Degradation Products (total degradation)
  trigger: Total degradation products observed in the relevant batches of the drug product must be reported
    with the analytical procedures indicated -- a degradation-products specification with no reported total
    degradation figure is incomplete.
  provenance_span_id:
    doc_id: ich-Q3B-R2
    start: 10054
    end: 10161
    hash: 9c0215545293905e
- id: Q6A-DESCRIPTION
  family: 3.2.S.4.1
  citation: ICH Q6A -- 3.3.1(a) Description
  trigger: The drug-substance specification must include a Description test -- a qualitative statement of state
    and color -- and any change in these characteristics during storage must be investigated; an absent
    Description test is an incomplete specification.
  provenance_span_id:
    doc_id: ich-Q6A
    start: 23892
    end: 24005
    hash: c487a4639455edc8
- id: Q6A-MICROBIAL-LIMITS
  family: 3.2.P.5
  citation: ICH Q6A -- 3.3.2(g) Microbial Limits
  trigger: Where warranted, the drug-product specification must include microbial-limits testing (total aerobic
    count, yeasts/molds, and absence of specified objectionable organisms), suitably determined by a
    pharmacopoeial procedure -- an absent microbial-limits test where indicated is an incomplete specification.
  provenance_span_id:
    doc_id: ich-Q6A
    start: 36961
    end: 37281
    hash: bd9f9948666b31a7
- id: Q6A-UNIFORMITY-DOSAGE-UNITS
  family: 3.2.P.5
  citation: ICH Q6A -- 3.3.2(d) Uniformity of Dosage Units
  trigger: The drug-product specification must include a uniformity-of-dosage-units test (mass of the dosage
    form and content of active substance), determined by a pharmacopoeial procedure -- an absent uniformity
    test is an incomplete specification.
  provenance_span_id:
    doc_id: ich-Q6A
    start: 42314
    end: 42499
    hash: 203b0549fbf2da80
