[project]
name = "defpredict"
version = "0.1.0"
description = "Regulatory deficiency prediction with cited evidence"
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12.0",
    # data
    "openpyxl>=3.1",
    "pandas>=2.2",
    # parsing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # llm
    "openai>=2.40",
    "json-repair>=0.30",
    # embedding
    "sentence-transformers>=3.0",
    # rulebook + search_corpus local dense retrieval leg (D-RB5) -- runtime, not dev-only
    "faiss-cpu>=1.8",
    # databricks
    "databricks-sdk>=0.30",
    "databricks-sql-connector>=3.1",
    # observability
    "structlog>=24.1",
    # config / data-driven CTD-family registry (src/ingest/registry imports yaml)
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
finetune = [
    "peft>=0.11",
    "trl>=0.9",
    "torch>=2.3",
    "transformers>=4.42",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# `slow` marks real-embedding held-out-corpus tests (search_corpus re-embeds every chunk per query
# on the CPU-only backend, so a full held-out absence pass runs in minutes). Deselected by default
# so the standard suite stays fast; opt in with `pytest -m slow`. The always-on generality tripwires
# (no-constant, rename-invariance) plus the `absence-gate` CLI cover the recovery/overfitting
# contract on every run.
markers = [
    "slow: real-embedding held-out-corpus test; opt in with `-m slow` (deselected by default).",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
